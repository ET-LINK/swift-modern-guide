name: Deploy to GitHub Pages

# 本仓库的发布流水线：验证 → 构建 → 站点测试 → 资源预算 → 生成 PR 产物 → 部署 Pages。
# 说明：构建机由 GitHub 提供（ubuntu-latest），工具链通过 scripts/fetch-toolchains.sh 落盘，
# 任何一步失败整个发布即失败（fail-fast）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装 Swift Linux 运行依赖（官方 Linux 前置；runner 缺 libcurl 等会让 swift build 以 127 退出）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-13-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev \
            libncurses6 libtinfo6 libz3-dev pkg-config tzdata zlib1g-dev
          sudo ldconfig
      - name: 安装三套 Swift 工具链（6.2 / 6.3.3 / 6.4.2）
        run: bash scripts/fetch-toolchains.sh
      - name: 示例验证（全部样本，负例需带诊断失败）
        run: npm run verify:samples
      - name: 诊断（仅失败时）：SwiftPM 在 runner 上的真实报错
        if: failure()
        run: |
          export PATH="$PWD/.toolchains/swift-6.2/usr/bin:$PATH"
          echo "== which swift: $(command -v swift)"
          swift --version || true
          echo "== 系统信息: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -2)"
          echo "== libxml2 包与文件"
          (dpkg -l | grep -i libxml2 || true)
          (ls -l /usr/lib/x86_64-linux-gnu/libxml2* || true)
          echo "== ldd swift-build 缺失项"
          (ldd .toolchains/swift-6.2/usr/bin/swift-build | grep -i 'not found' || echo '无缺失')
          echo "== apt 候选"
          (apt-cache policy libxml2 libxml2t64 libxml2-dev 2>/dev/null | head -20 || true)
          echo "== swift build 输出（examples/f08/pkg）"
          cd examples/f08/pkg && swift build -v 2>&1 | tail -40 || true
      - name: 内容一致性检查
        run: npm run check:content

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建（含验证日志快照）
        run: npm run build
      - name: 链接检查
        run: npm run check:links
      - name: 资源预算检查（单页 ≤ 1.5MB）
        run: npm run check:budget
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 浏览器自测（含 390px、深色、搜索、复制、无外部请求）
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
